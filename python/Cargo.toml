[package]
name = "melosim-py"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "roundtrip"
path = "src/bin/roundtrip.rs"

[features]
default = ["pyo3"]
pyo3 = ["dep:pyo3"]

[dependencies]
melosim = { path = ".." }
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
serde_json = "1"
