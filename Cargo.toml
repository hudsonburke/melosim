[workspace]
resolver = "2"
members = ["."]

[package]
name = "melosim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
  "3d",
  "bevy_dev_tools",
  "free_camera",
  "x11",
  "wayland",
  "png",
  "bevy_window",
  "bevy_state",
  "dynamic_linking",
  "bevy_world_serialization",
] }
nalgebra = "=0.35"
pyo3 = { version = "0.26", features = ["auto-initialize"], optional = true }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[features]
# OpenSim import via the Python API (PyO3). Needs the repo venv; on this
# machine .cargo/config.toml supplies PYO3_PYTHON / PYTHONPATH / LD_LIBRARY_PATH.
opensim = ["dep:pyo3"]
