[workspace]
resolver = "2"
members = [".", "python"]

[package]
name = "melosim"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
inventory = "0.3"
mujoco-rs = { version = "5", features = [
  "auto-download-mujoco",
], optional = true }
bevy = { version = "0.19.0", features = ["dynamic_linking"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[features]
default = ["mujoco"]
mujoco = ["dep:mujoco-rs"]
