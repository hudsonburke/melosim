[env]
# mujoco-rs build script uses this to find/download MuJoCo.
# "relative = true" resolves against the workspace root.
MUJOCO_DOWNLOAD_DIR = { value = ".mujoco", relative = true }

# Limit parallel jobs to prevent OOM on 15GB system
CARGO_BUILD_JOBS = "2"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/mold"]

# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
