[package]
name = "melosim-server"
version = "0.1.0"
edition = "2024"

[dependencies]
melosim = { path = "..", features = ["mujoco"] }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
